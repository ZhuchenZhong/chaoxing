<VirtualHost *:80>
    ServerName chaoxing.k1d.tech

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    RequestHeader set X-Forwarded-Port expr=%{SERVER_PORT}

    # API backend
    ProxyPass /api/ http://127.0.0.1:18000/api/
    ProxyPassReverse /api/ http://127.0.0.1:18000/api/

    ProxyPass /health http://127.0.0.1:18000/health
    ProxyPassReverse /health http://127.0.0.1:18000/health

    # Frontend (catch-all)
    ProxyPass / http://127.0.0.1:18080/
    ProxyPassReverse / http://127.0.0.1:18080/
</VirtualHost>

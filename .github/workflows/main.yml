name: CI

on:
  push:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            architecture: 'x64'
            name: 'win64'

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{matrix.architecture}}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv sync --frozen
          uv pip install pyinstaller

      - name: Test
        run: |
          uv run python -m unittest discover -s tests -v
          uv run python -m compileall -q api main.py chaoxing_cli.py app.py tests

      - name: Build win bin
        run: uv run pyinstaller -F chaoxing_cli.py -n 'chaoxing' --add-data "resource;resource" --hidden-import=chardet

      - name: Create release package
        run: |
          mkdir release
          copy dist\chaoxing.exe release\
          copy config_template.ini release\
          cd release
          7z a -tzip chaoxing.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: 'release/chaoxing.zip'

[project]
name = "chaoxing-web"
version = "4.0.0-alpha.1"
description = "Chaoxing web-first platform backend"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "GPL-3.0-only"
dependencies = [
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "beautifulsoup4>=4.12.3",
  "bcrypt<4.1",
  "celery[redis]>=5.4.0",
  "fastapi>=0.115.6",
  "fonttools>=4.47.0",
  "httpx>=0.28.1",
  "passlib[bcrypt]>=1.7.4",
  "pyaes>=1.6.1",
  "pydantic-settings>=2.7.0",
  "pyjwt>=2.10.1",
  "python-multipart>=0.0.20",
  "redis>=5.2.1",
  "sqlalchemy>=2.0.36",
  "structlog>=24.4.0",
  "typer>=0.15.1",
  "uvicorn>=0.34.0",
]

[project.scripts]
chaoxing-manage = "chaoxing.cli:main"

[project.optional-dependencies]
captcha = [
  "ddddocr>=1.4.0",
]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.8.4",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
